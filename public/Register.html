<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Health & Fitness Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="Authentication.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
                <i class="fa-solid fa-heart-pulse fa-3x" style="color: var(--primary-purple); margin-bottom: 16px; display: inline-block;"></i>
                <h2>Create an Account</h2>
                <p>Start your fitness journey today</p>
            </div>

            <div id="registerError" class="error-message" style="display: none;"></div>

            <form id="registerForm">
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullname" placeholder="John Doe" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye toggle-password" style="cursor: pointer;"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye toggle-password" style="cursor: pointer;"></i>
                </div>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>
    </div>

<script src="Authentication.js"></script>
</body>
</html>

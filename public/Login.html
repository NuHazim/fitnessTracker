<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Health & Fitness Tracker</title>
    <link rel="stylesheet" href="Authentication.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
                <img src="Logo.png" alt="Health & Fitness Tracker Logo" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 16px;">
                <h2>Welcome Back</h2>
                <p>Sign in to your Health & Fitness Tracker account</p>
            </div>

            <div id="loginError" class="error-message" style="display: none;">
                Invalid email or password. Please try again.
            </div>

            <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <span class="toggle-password">👁️</span> 
                </div>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>

    

    <script src="Authentication.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Health & Fitness Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="Authentication.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
                <i class="fa-solid fa-heart-pulse fa-3x" style="color: var(--primary-purple); margin-bottom: 16px; display: inline-block;"></i>
                <h2>Welcome Back</h2>
                <p>Sign in to your Health & Fitness Tracker account</p>
            </div>

            <div id="loginError" class="error-message" style="display: none;">
                Invalid email or password. Please try again.
            </div>

            <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye toggle-password" style="cursor: pointer;"></i>
                </div>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>

    

    <script src="Authentication.js"></script>
</body>
</html>
